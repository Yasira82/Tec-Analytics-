name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-policy:
    name: Drift Detection — KB claims vs code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Drift Detection — KB claims vs code
        # Each check maps to a C-doc; a violation = doc↔runtime drift.
        # ADR-009 (payment contract) · C-12 §11 (CSRF) · C-76/ADR-007 (dual-mode guard).
        run: |
          violations=0
          # ── ADR-009: internal-auth header + amount-as-number ────────────
          if grep -rniE 'x-service-secret|SERVICE_SECRET' src; then
            echo "::error::ADR-009: use x-internal-key / INTERNAL_SECRET (not x-service-secret / SERVICE_SECRET)"
            violations=1
          fi
          if grep -rnE 'amount:[[:space:]]*z\.string' src | grep -qi payment; then
            echo "::error::ADR-009: payment amount must be a number — no z.string() for amount in payment routes"
            violations=1
          fi
          # ── C-12 §11 / P2: CSRF middleware-only — no route-level validate-and-403 ──
          if grep -rnE 'csrfCookie !== csrfHeader|csrfCookie === csrfHeader|CSRF validation failed|CSRF token mismatch' src/app/api 2>/dev/null; then
            echo "::error::CSRF must be enforced ONLY in middleware (P2). Remove route-level CSRF checks — they 403 legit Pi-Browser payments. (KB C-12 §11)"
            violations=1
          fi
          # ── C-76 / ADR-007: every Mode-2 buy handler must guard ─────────
          # Any component/page triggering createU2APayment() must check
          # isHubNavigation() first (pi-test diagnostic harness is exempt).
          handlers=$(grep -rlE 'createU2APayment\(' src/app src/components --include=*.tsx 2>/dev/null | grep -v '/pi-test/' || true)
          for f in $handlers; do
            if ! grep -qE 'isHubNavigation' "$f"; then
              echo "::error::ADR-007 (C-76): $f triggers a Mode-2 Pi payment without isHubNavigation() guard"
              violations=1
            fi
          done
          # ── NEW-A: internal gateway URL must never reach the client bundle ──
          # No NEXT_PUBLIC_* gateway var and no Railway host literal anywhere in
          # src — the gateway is addressed server-side only (API_GATEWAY_URL).
          if grep -rn 'NEXT_PUBLIC_API_GATEWAY_URL' src | grep -vE '__tests__|\.test\.'; then
            echo "::error::NEW-A: NEXT_PUBLIC_API_GATEWAY_URL leaks the internal gateway URL into the client bundle. Use server-only API_GATEWAY_URL in BFF routes."
            violations=1
          fi
          if grep -rniE '[a-z0-9-]+\.up\.railway\.app' src | grep -vE '__tests__|\.test\.'; then
            echo "::error::NEW-A: hardcoded Railway host in src — internal URLs must come from server-only env, never literals in code."
            violations=1
          fi
          # ── C-105 §6: merchant isolation — identity from session, NOT input ──
          # Analytics BFF routes must derive merchant/user identity from the
          # tec_user session cookie, never from a query param or request body.
          if grep -rnE "searchParams\.get\(['\"](merchant|user)_?[iI]d|body\.(merchantId|userId|merchant_id|user_id)" src/app/api/bff/analytics 2>/dev/null; then
            echo "::error::C-105 §6: analytics BFF must derive merchantId from the tec_user session cookie — never from a query param or request body (cross-merchant leak / P6)."
            violations=1
          fi
          [ "$violations" -eq 0 ] && echo "Drift Detection OK — code matches KB claims" || exit 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install
        run: npm install --legacy-peer-deps
      - name: Lint
        run: npm run lint
        continue-on-error: true

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install
        run: npm install --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install
        run: npm install --legacy-peer-deps
      - name: Test
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install
        run: npm install --legacy-peer-deps
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_PI_SANDBOX:      'true'
          NEXT_PUBLIC_API_GATEWAY_URL: ${{ secrets.NEXT_PUBLIC_API_GATEWAY_URL || 'https://api-gateway-production-6a68.up.railway.app' }}
          NEXT_PUBLIC_PI_APP_ID:       ${{ secrets.NEXT_PUBLIC_PI_APP_ID || 'test-app-id' }}
